services:
  app:
    build: .
    ports:
      - "8000:8000"          # ou 8080:8000 si tu préfères
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cicdflow
      POSTGRES_USER: cicdflow
      POSTGRES_PASSWORD: cicdflow123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
